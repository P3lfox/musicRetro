[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/P3lfox/musicRetro"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Faster local iteration: optimize dependencies even in debug builds,
# so audio decoding and rendering are not painfully slow during development.
[profile.dev.package."*"]
opt-level = 2
