[package]
name = "retro-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = "0.18.2"
rtrb = "0.4.1"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "aac", "isomp4", "ogg", "vorbis", "wav", "pcm", "id3v2"] }
thiserror = "2.0.21"

# Battery status on Windows via GetSystemPowerStatus (tiny, no runtime).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }
